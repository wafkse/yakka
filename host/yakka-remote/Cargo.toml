[package]
name = "yakka-remote"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.37", features = ["derive", "unicode"] }
crossterm = "0.29.0"
log = "0.4.27"
ratatui = "0.29.0"
tokio = { version = "1.44.2", features = [
    "rt-multi-thread",
    "net",
    "macros",
    "sync",
] }
