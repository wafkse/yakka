[package]
name = "yakka-control"
version = "0.1.0"
edition = "2024"

[features]
default = ["debug-impl", "defmt"]
debug-impl = []
defmt = ["dep:defmt"]


[dependencies]
defmt = { workspace = true, optional = true }

num = { version = "0.4.3", default-features = false }
yakka-number = { version = "0.1.0", path = "../shared/yakka-number" }
yakka-time = { version = "0.1.0", path = "../shared/yakka-time" }
yakka-unit = { version = "0.1.0", path = "../shared/yakka-unit" }
